services:
  sub2api:
    image: ${SUB2API_IMAGE:-sub2api:oracle-amd64}
    container_name: sub2api
    restart: unless-stopped
    mem_limit: 760m
    ports:
      - "${SERVER_BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_MODE: ${SERVER_MODE:-release}
      RUN_MODE: ${RUN_MODE:-standard}
      TZ: ${TZ:-Asia/Shanghai}
      GOMEMLIMIT: ${APP_GOMEMLIMIT:-512MiB}
      GOGC: ${APP_GOGC:-80}

      DATABASE_HOST: ${ORACLE_DB_PRIVATE_IP:?ORACLE_DB_PRIVATE_IP is required}
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-sub2api}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: ${POSTGRES_DB:-sub2api}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-6}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-2}
      DATABASE_CONN_MAX_LIFETIME_MINUTES: "30"
      DATABASE_CONN_MAX_IDLE_TIME_MINUTES: "5"

      REDIS_HOST: ${ORACLE_DB_PRIVATE_IP:?ORACLE_DB_PRIVATE_IP is required}
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-20}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-2}
      REDIS_ENABLE_TLS: "false"

      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sub2api.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE_HOUR: "24"
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}

      GATEWAY_IMAGE_CONCURRENCY_ENABLED: "true"
      GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS: "1"
      GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE: reject
      GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS: "30"
      GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS: "10"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
